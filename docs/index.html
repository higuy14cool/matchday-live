<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Matchday Live — tournaments & live scoreboards</title>
  <meta name="description" content="Run soccer and basketball tournaments, schedule games, keep score and go live with a scoreboard overlay." />
  <meta name="theme-color" content="#080c0a" />
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link rel="icon" href="assets/favicon-32.png" sizes="32x32" type="image/png" />
  <link rel="icon" href="assets/favicon-16.png" sizes="16x16" type="image/png" />
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png" />
  <link rel="manifest" href="site.webmanifest" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#/" aria-label="Matchday Live home">
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="22" height="22"><circle cx="12" cy="12" r="9.2" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 6.6l3.4 2.5-1.3 4h-4.2l-1.3-4L12 6.6z" fill="currentColor"/><path d="M4.4 10.2l2.2-.2M19.6 10.2l-2.2-.2M7.3 19l1.4-3.4M16.7 19l-1.4-3.4M12 21v-3.4" fill="none" stroke="currentColor" stroke-width="1.6"/></svg>
      </span>
      <span class="brand-text">Matchday<span>Live</span></span>
    </a>
    <nav class="topnav">
      <a href="#/" data-nav="home">Tournaments</a>
      <a href="#/live" data-nav="live">Live now</a>
      <button class="btn btn-primary btn-sm" data-action="new-tournament">+ New tournament</button>
      <span class="user-area" id="user-area"></span>
    </nav>
  </header>

  <main id="app" aria-live="polite"></main>

  <footer class="footer">
    <span>Matchday Live</span>
    <span class="dot"></span>
    <span>Soccer &amp; basketball tournaments, live scoreboards and video.</span>
  </footer>

  <div id="toasts" class="toasts" role="status" aria-live="polite"></div>
  <div id="modal-root"></div>

  <script type="module" src="js/local/boot.js"></script>
</body>
</html>
